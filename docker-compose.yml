services:
  postgres:
    image: postgres:16-alpine
    container_name: orderhub-postgres
    environment:
      POSTGRES_DB: orderhub
      POSTGRES_USER: orderhub
      POSTGRES_PASSWORD: orderhub
    ports:
      - "5432:5432"
    volumes:
      - orderhub-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderhub -d orderhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    # CI builds the image first and starts it with --no-build under this tag
    image: ${ORDERHUB_IMAGE:-orderhub:local}
    container_name: orderhub-app
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/orderhub
      DB_USERNAME: orderhub
      DB_PASSWORD: orderhub
      JWT_SECRET: docker-compose-secret-please-override-in-real-envs-42
      TZ: Europe/Dublin
    ports:
      - "8080:8080"
      - "8081:8081"

volumes:
  orderhub-data:
