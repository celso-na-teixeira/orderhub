spring:
  application:
    name: orderhub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderhub}
    username: ${DB_USERNAME:orderhub}
    password: ${DB_PASSWORD:orderhub}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: simple
    cache-names: products
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:orderhub-dev-secret-key-change-me-please-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  reservation:
    ttl: 15m
    cleanup-interval-ms: 60000
  reporting:
    low-stock-threshold: 5

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.orderhub: DEBUG
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE
    # org.springframework.transaction: DEBUG
    # org.springframework.orm.jpa.JpaTransactionManager: DEBUG
