spring:
  application:
    name: orderhub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderhub}
    username: ${DB_USERNAME:orderhub}
    password: ${DB_PASSWORD:orderhub}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: simple
    cache-names: products
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080

management:
  # actuator listens on its own port, which is scraped and probed inside the cluster and not routed by the load balancer
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      # /actuator/health/liveness and /actuator/health/readiness; readiness also fails while the database is down
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    # every request is traced locally; production samples (see application-prod.yml).
    # Spans are exported over OTLP only when MANAGEMENT_OTLP_TRACING_ENDPOINT is set.
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:orderhub-dev-secret-key-change-me-please-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  reservation:
    ttl: 15m
    cleanup-interval-ms: 60000
  reporting:
    low-stock-threshold: 5

logging:
  # human readable locally; production logs ECS JSON instead (see application-prod.yml)
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{traceId:-},%X{requestId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.orderhub: DEBUG
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE
    # org.springframework.transaction: DEBUG
    # org.springframework.orm.jpa.JpaTransactionManager: DEBUG
